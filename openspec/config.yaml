schema: spec-driven

context: |
  Project: an agent harness for making and testing Manor Lords mods, and the Invasion Mod built with it.
  CLAUDE.md holds the full project rules. These are the rules that shape OpenSpec artifacts.

  Writing:
  - Use simplified technical English: short sentences, common words, one idea per sentence.
  - Use the same term for the same thing.
  - "Spec scenario" means an OpenSpec `#### Scenario:` block. "Test scenario" means a harness
    scenario file in `harness/scenarios/` or `mod/InvasionMod/scenarios/`. Never say only "scenario".

  Capabilities (folders in `openspec/specs/`):
  - Harness capabilities: `harness/<name>`, for example `harness/run-launcher`.
  - Invasion Mod features: `mod/<feature>`. `<feature>` is the folder name in
    `mod/InvasionMod/Scripts/features/<feature>/`. The shared parts (loader, scheduler, config): `mod/core`.
  - Process rules: `process/<name>`, for example `process/spec-workflow`.

  Game facts:
  - The simulation is not deterministic. Acceptance checks assert ranges, not exact values.
  - A game crash is a result with logs, not a harness failure.
  - Only the guarded harness action `save_game` may save. Never plan a save call anywhere else.

  Game design (the user owns it; do not change it unless asked):
  - `design/mod/invasion-mod.md` is the guiding philosophy of every mod spec. `design/mod/decisions.md` is the
    decision log; cite decisions by number ("decision 28").
  - Vision: a lieutenant lord in Franconia during the Hussite Wars restores order while an invader raids
    in announced waves, unrest grows inside, and the liege expects duty. A lost battle sacks the town; it
    does not end the game.
  - Pillars: (1) order is the goal; (2) rule through others: vassals only by policies and orders;
    (3) scarcity forces expansion: home resources are finite, vassals supply; (4) dread from knowing:
    raids are announced, the great raid has a visible clock; (5) raids have goals, battles can end by
    native rout; (6) one path of rule: oppression or prosperity, exclusive.
  - Out of scope for now: multiplayer, building inside vassal regions, new models or animations, raid
    types other than plunder and subjugation, intel and scouting.

  Other docs:
  - The old legacy specs are archived unchanged in `openspec/changes/archive/<date>-legacy-*/`. They are
    read-only history. Read them as source material. Do not edit them.
  - `docs/wiki/` explains how the code and the game engine work. It is not a spec.

rules:
  proposal:
    - "Link the GitHub issue that tracks the change. Also set `x-issue: <n>` in the change's `.openspec.yaml`."
    - State the non-goals.
    - Name the legacy doc folder the change continues, if there is one.
    - A mod proposal names the section of `design/mod/invasion-mod.md` (or the decision number) it serves, and says how it keeps the design pillars. It must not contradict a pillar; if it would, stop and ask the user.
  specs:
    - A requirement states behavior a player, a scenario or a harness user can observe.
    - Each spec scenario names its check, as "Checked by `<path>`" (a test scenario or a Python test in `harness/tests/`), says "Checked by review" for a process rule, or says "Not checked yet".
    - For game behavior, write the THEN step as a range (for example "between 30 and 90 game days").
    - "Put the comment `<!-- Issue: #<n> -->` under the first section heading of each delta spec. A line above the first heading fails `openspec validate --strict`."
  design:
    - Record open questions with the spike that will answer them.
    - Point to engine facts in the wiki or in `notes/` of this change. Do not copy them.
  tasks:
    - Each task states how it is verified (a fake game test, a real game run, a command or a review).
    - Include a task to update the wiki, the skills and `CHANGELOG.md` when the change needs it.
    - When a result is visual (UI, text on screen, models, materials, placement and geometry, units in the world, world results the player sees), include a task to capture picture evidence into `evidence/` with `ctx.screenshot(name)`.
    - End with a task for the test results table of the implementation pull request.

operations:
  apply:
    guidance:
      - Put spike findings in `openspec/changes/<change>/notes/<topic>.md`, one file per topic.
      - Start every Python command with `uv run python`.
  archive:
    guidance:
      - Before the archive, move engine facts from `notes/` that stay true into the wiki.
      - Archive in the implementation pull request (gate 2), as its last commit before it is submitted for review. A change with nothing to build archives in its single pull request.
      - Never archive in a spec pull request (gate 1).
