<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liege contracts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+SC:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0a}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid #e8c87a;outline-offset:3px}
.close:hover span.word{color:#e8c87a}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #1c1b18 0%, #0e0e0d 70%, #090908 100%); color: #f2ede2; font-family: Alegreya, serif; display: flex; flex-direction: column; align-items: center;">

  <div style="padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <h1 style="margin: 0; font-family: 'Alegreya SC', serif; font-weight: 500; font-size: 26px; letter-spacing: 5px; color: #f2ede2;">Contracts of the Liege</h1>
    <div style="width: 300px; height: 1px; background: linear-gradient(90deg, transparent, #9c8455 20%, #9c8455 80%, transparent);"></div>
  </div>

  <div style="margin-top: 10px; display: flex; gap: 64px; font-size: 19px; color: #c9c1b0;">
    <span>Time to fulfil contracts: <span style="color: #e8c87a;">210 days</span></span>
    <span>Contracts refresh: <span style="color: #e8c87a;">in spring, in 300 days</span></span>
  </div>

  <div style="margin-top: 14px; width: 1360px; flex-grow: 1; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, rgba(58,55,49,0.92), rgba(40,38,34,0.92)); box-shadow: inset 0 0 60px rgba(0,0,0,0.55), 0 0 0 1px #2c2a26; clip-path: polygon(0 1%, 3% 0, 40% 0.6%, 70% 0, 97% 0.8%, 100% 0, 99.6% 50%, 100% 99%, 60% 100%, 30% 99.3%, 1% 100%, 0 97%);">
    <sc-for list="{{tiers}}" as="tier" hint-placeholder-count="3">
      <div style="display: flex; gap: 14px; flex: 1; min-height: 0;">
        <div style="width: 170px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(15,15,13,0.45);">
          <span style="font-size: 26px; font-weight: 500;">{{tier.name}}</span>
          <div style="width: 90px; height: 1px; background: #6d5d3e;"></div>
          <span style="font-size: 15px; color: #a9a190;">Fulfilled</span>
          <span style="font-size: 24px; color: {{tier.countColor}};">{{tier.used}} / {{tier.limit}}</span>
        </div>
        <sc-for list="{{tier.cards}}" as="card" hint-placeholder-count="3">
          <div style="{{card.style}}">
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span style="color: #8f8878; font-size: 15px;">&#9671;</span>
              <span style="font-size: 18px;">Deliver <span style="color: #e8c87a; letter-spacing: 1px; text-transform: uppercase; font-size: 16px;">{{card.amount}} {{card.good}}</span></span>
            </div>
            <span style="font-size: 15px; color: {{card.haveColor}}; padding-left: 22px;">In storage: {{card.have}}</span>
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span style="color: #8f8878; font-size: 15px;">&#9671;</span>
              <span style="font-size: 18px;">Reward: <span style="color: #e8c87a; letter-spacing: 1px; text-transform: uppercase; font-size: 16px;">{{card.reward}}</span></span>
            </div>
            <span style="flex-grow: 1;"></span>
            <button type="button" onClick="{{card.onClick}}" disabled="{{card.disabled}}" aria-label="{{card.aria}}" style="{{card.btnStyle}}">{{card.btn}}</button>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <button type="button" class="close" style="height: 62px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; font-size: 30px; color: #f2ede2;">
    <span style="font-size: 20px; color: #c9c1b0;">&#10087;</span><span class="word">Close</span><span style="font-size: 20px; color: #c9c1b0; display: inline-block; transform: scaleX(-1);">&#10087;</span>
  </button>
  <span style="position: absolute; right: 120px; bottom: 6px; font-size: 13px; color: #6f6a60;">EARLY ACCESS (Version 0.8.117) MODDED</span>
  <button type="button" onClick="{{reset}}" style="position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: #6f6a60; border: 1px solid #3a3731; padding: 4px 10px;">Demo: new spring</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {}, limit: 1, offer: this.deal() };
  }
  // Requests, weights and rewards copied from mod/InvasionMod/data/liege_contracts/contracts.json and config.lua (difficulty 1.0).
  table() {
    const T1 = [['planks',1.0],['berries',1.4],['mushrooms',1.2],['small game',1.0],['hides',0.8],['rubble stone',1.6],['clay',1.4],['carrots',1.2],['beets',1.2],['cabbage',1.2],['salt',0.6],['bows',0.4],['carp',1.0]];
    const T2 = [['cut stone',1.0],['apples',1.2],['quinces',1.0],['pears',1.2],['tools',0.5],['metal bars',0.8],['wooden parts',0.8],['eel',1.0]];
    const T3 = [['swords',1.0],['shields',1.0],['polearms',1.0],['spears',1.2],['large shields',1.0],['helmets',0.6],['gambesons',0.6],['mail armor',0.4],['plate armor',0.35],['crossbows',0.8],['smoked fish',1.2],['sausages',1.2]];
    const WEAPONS = ['swords','shields','polearms','spears','large shields','crossbows'];
    const names = (l) => l.map((g) => g[0]);
    return [
      { id: 'small', name: 'Small', base: 50, requests: T1, rewards: [
        { kind: 'goods', list: names(T1), min: 20, max: 40 }, { kind: 'regional wealth', min: 40, max: 80 } ] },
      { id: 'medium', name: 'Medium', base: 30, requests: T2, rewards: [
        { kind: 'goods', list: WEAPONS, min: 10, max: 20 }, { kind: 'goods', list: names(T2), min: 15, max: 30 }, { kind: 'treasury silver', min: 150, max: 300 } ] },
      { id: 'large', name: 'Large', base: 15, requests: T3, rewards: [
        { kind: 'tech point', min: 1, max: 1 }, { kind: 'influence', min: 1000, max: 1000 } ] }
    ];
  }
  deal() {
    const pick = (l) => l[Math.floor(Math.random() * l.length)];
    const between = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    return this.table().map((t) => {
      const pool = t.requests.slice();
      const cards = [];
      for (let i = 0; i < 3; i++) {
        const req = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        const amount = Math.max(1, Math.round(t.base * req[1]));
        const r = pick(t.rewards);
        let reward;
        if (r.kind === 'goods') reward = '+' + between(r.min, r.max) + ' ' + pick(r.list.filter((g) => g !== req[0]));
        else reward = '+' + between(r.min, r.max) + ' ' + r.kind;
        const have = Math.random() < 0.5 ? amount + between(0, 20) : between(0, amount - 1);
        cards.push({ amount: amount, good: req[0], have: have + ' / ' + amount, ok: have >= amount, reward: reward });
      }
      return { id: t.id, name: t.name, cards: cards };
    });
  }
  data() { return this.state.offer; }
  fulfil(tier, idx) {
    const done = Object.assign({}, this.state.done);
    done[tier] = (done[tier] || []).concat([idx]);
    this.setState({ done: done });
  }
  renderVals() {
    const s = this.state;
    const base = 'flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; ';
    const btnBase = 'height: 38px; font-family: Alegreya, serif; font-size: 22px; ';
    const tiers = this.data().map((t) => {
      const done = s.done[t.id] || [];
      const full = done.length >= s.limit;
      const cards = t.cards.map((c, i) => {
        const isDone = done.indexOf(i) >= 0;
        const can = c.ok && !full && !isDone;
        let style = base + 'background: rgba(20,19,17,0.55); border-top: 1px solid #4a463e;';
        if (isDone) style = base + 'background: rgba(60,50,30,0.55); border-top: 1px solid #e8c87a;';
        else if (!can) style = base + 'background: rgba(20,19,17,0.3); border-top: 1px solid #33302b; opacity: 0.6;';
        return {
          amount: c.amount, good: c.good, reward: c.reward, have: c.have, style: style,
          haveColor: c.ok ? '#c9c1b0' : '#b0705c',
          btn: isDone ? 'Fulfilled' : 'Fulfil', disabled: !can,
          btnStyle: btnBase + (isDone ? 'color: #e8c87a;' : can ? 'color: #f2ede2;' : 'color: #77716a;'),
          onClick: () => this.fulfil(t.id, i),
          aria: (isDone ? 'Fulfilled: ' : 'Fulfil: deliver ') + c.amount + ' ' + c.good + ', reward ' + c.reward
        };
      });
      return { name: t.name, cards: cards, used: done.length, limit: s.limit, countColor: full ? '#8f8878' : '#e8c87a' };
    });
    return { tiers: tiers, reset: () => this.setState({ done: {}, offer: this.deal() }) };
  }
}
</script>
</body>
</html>
