<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vassals menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+SC:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0a}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid #e8c87a;outline-offset:3px}
.opt:hover:not(:disabled){color:#f2ede2 !important}
.act:hover .word{color:#e8c87a}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #1c1b18 0%, #0e0e0d 70%, #090908 100%); color: #f2ede2; font-family: Alegreya, serif; display: flex; flex-direction: column; align-items: center;">

  <div style="padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <h1 style="margin: 0; font-family: 'Alegreya SC', serif; font-weight: 500; font-size: 26px; letter-spacing: 5px;">Vassals</h1>
    <div style="width: 240px; height: 1px; background: linear-gradient(90deg, transparent, #9c8455 20%, #9c8455 80%, transparent);"></div>
  </div>

  <div style="margin-top: 10px; display: flex; gap: 64px; font-size: 19px; color: #c9c1b0;">
    <span>Vassals: <span style="color: #e8c87a;">{{count}} / 3</span></span>
    <span>Tribute each month: <span style="color: #e8c87a;">{{tribute}}</span></span>
    <span>Treasury: <span style="color: #e8c87a;">{{silver}} silver</span></span>
  </div>

  <div style="margin-top: 14px; width: 1360px; flex-grow: 1; box-sizing: border-box; padding: 18px 22px; display: flex; gap: 16px; background: linear-gradient(180deg, rgba(58,55,49,0.92), rgba(40,38,34,0.92)); box-shadow: inset 0 0 60px rgba(0,0,0,0.55); clip-path: polygon(0 1%, 3% 0, 40% 0.6%, 70% 0, 97% 0.8%, 100% 0, 99.6% 50%, 100% 99%, 60% 100%, 30% 99.3%, 1% 100%, 0 97%);">
    <sc-for list="{{slots}}" as="v" hint-placeholder-count="3">
      <div style="{{v.style}}">
        <div style="background: rgba(15,15,13,0.5); padding: 10px 0; text-align: center;">
          <div style="font-size: 26px;">{{v.region}}</div>
          <div style="font-size: 16px; color: #a9a190;">{{v.lordLine}}</div>
        </div>
        <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #3a3731; padding-bottom: 6px;">
            <span style="font-size: 18px;"><span style="color: #8f8878; font-size: 14px;">&#9671;</span> Status</span>
            <span style="font-size: 17px; letter-spacing: 1px; text-transform: uppercase; color: {{v.statusColor}};">{{v.status}}</span>
          </div>
          <sc-for list="{{v.stats}}" as="s">
            <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #3a3731; padding-bottom: 6px;">
              <span style="font-size: 18px;"><span style="color: #8f8878; font-size: 14px;">&#9671;</span> {{s.label}}</span>
              <span style="font-size: 18px; color: #e8c87a;">{{s.value}}</span>
            </div>
          </sc-for>
          <span style="font-size: 15px; color: #a9a190; min-height: 40px; line-height: 1.35;">{{v.note}}</span>
        </div>
        <span style="flex-grow: 1;"></span>
        <div style="display: {{v.policyDisplay}}; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 6px;">
          <span style="font-size: 15px; color: #a9a190; letter-spacing: 2px; text-transform: uppercase;">Policy</span>
          <div style="display: flex; gap: 30px;">
            <sc-for list="{{v.policies}}" as="p">
              <button type="button" class="opt" onClick="{{p.onClick}}" aria-pressed="{{p.selected}}" style="{{p.style}}">{{p.text}}</button>
            </sc-for>
          </div>
          <span style="font-size: 15px; color: #a9a190;">{{v.policyHint}}</span>
        </div>
        <div style="display: {{v.restoreDisplay}}; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 10px;">
          <button type="button" class="act" onClick="{{v.onRestore}}" disabled="{{v.restoreDisabled}}" style="{{v.restoreStyle}}"><span class="word">Restore the village</span></button>
          <span style="font-size: 15px; color: {{v.restoreHintColor}};">{{v.restoreHint}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <button type="button" class="act" style="height: 62px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; font-size: 30px;">
    <span style="font-size: 20px; color: #c9c1b0;">&#10087;</span><span class="word">Close</span><span style="font-size: 20px; color: #c9c1b0; display: inline-block; transform: scaleX(-1);">&#10087;</span>
  </button>
  <span style="position: absolute; right: 120px; bottom: 6px; font-size: 13px; color: #6f6a60;">EARLY ACCESS (Version 0.8.117) MODDED</span>
  <button type="button" onClick="{{reset}}" style="position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: #6f6a60; border: 1px solid #3a3731; padding: 4px 10px;">Demo: reset</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial();
  }
  initial() {
    return {
      silver: 140,
      slots: [
        { region: 'Hochweg', lord: 'Aldric', status: 'thriving', policy: 'fair', families: 14, buildings: 31, rich: ['iron ore', 'salt'], days: 412 },
        { region: 'Obere Wiese', lord: 'Bertram', status: 'stalled', policy: 'heavy', families: 6, buildings: 9, rich: ['clay', 'farmland'], days: 64 },
        { region: 'Krumme Leite', lord: null, status: 'wiped', policy: 'fair', families: 0, buildings: 0, rich: ['stone', 'berries'], days: 0 }
      ]
    };
  }
  setPolicy(i, p) {
    const slots = this.state.slots.slice();
    slots[i] = Object.assign({}, slots[i], { policy: p });
    this.setState({ slots: slots });
  }
  restore(i) {
    const slots = this.state.slots.slice();
    slots[i] = Object.assign({}, slots[i], { lord: 'Conrad', status: 'rebuilding', families: 5, buildings: 2, days: 0, rebuilt: 0 });
    this.setState({ slots: slots, silver: this.state.silver - 100 });
  }
  renderVals() {
    const s = this.state;
    const FACTOR = { light: 0.5, fair: 1.0, heavy: 1.5 };
    const STATUS = {
      thriving: ['Thriving', '#9fb37a'], stalled: ['Stalled', '#d0a050'],
      rebuilding: ['Rebuilding', '#d0a050'], wiped: ['Wiped', '#b0705c']
    };
    const base = 'flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; ';
    const BASE = 100;
    const GOOD = (r) => (r === 'farmland' ? 'flax' : r);
    const totals = {};
    let count = 0;
    const slots = s.slots.map((v, i) => {
      const wiped = v.status === 'wiped';
      const rebuilding = v.status === 'rebuilding';
      const pays = !wiped && !rebuilding;
      const each = Math.round(BASE * FACTOR[v.policy]);
      if (pays) v.rich.forEach((r) => { const g = GOOD(r); totals[g] = (totals[g] || 0) + each; });
      const t = v.rich.map((r) => each + ' ' + GOOD(r)).join(', ');
      if (!wiped) count += 1;
      const notes = {
        thriving: 'The lord sends the rich resources of the region each month.',
        stalled: 'The lord has built fewer than 3 buildings in 10 days.',
        rebuilding: 'No tribute until half of the ruins are rebuilt (0 of 22).',
        wiped: 'A Hussite sack ruined the village. The land is rubble.'
      };
      const canRestore = s.silver >= 100;
      return {
        region: v.region,
        lordLine: wiped ? 'No lord' : 'Lord ' + v.lord,
        style: base + (wiped ? 'background: rgba(60,25,20,0.25); border-top: 1px solid #6b3a30;' : 'background: rgba(20,19,17,0.55); border-top: 1px solid #4a463e;'),
        status: STATUS[v.status][0], statusColor: STATUS[v.status][1],
        stats: wiped ? [] : [
          { label: 'Rich resources', value: v.rich.join(', ') },
          { label: 'Tribute / month', value: pays ? t : 'none' },
          { label: 'Families', value: String(v.families) },
          { label: 'Buildings', value: String(v.buildings) },
          { label: 'Vassal for', value: v.days + ' days' }
        ],
        note: notes[v.status],
        policyDisplay: wiped ? 'none' : 'flex',
        policies: ['light', 'fair', 'heavy'].map((p) => ({
          text: p[0].toUpperCase() + p.slice(1),
          selected: v.policy === p ? 'true' : 'false',
          style: 'font-size: 21px; padding: 2px 0; ' + (v.policy === p ? 'color: #e8c87a; border-bottom: 1px solid #e8c87a;' : 'color: #8f8878; border-bottom: 1px solid transparent;'),
          onClick: () => this.setPolicy(i, p)
        })),
        policyHint: 'Tribute x' + FACTOR[v.policy] + ': ' + each + ' of each rich resource',
        restoreDisplay: wiped ? 'flex' : 'none',
        restoreDisabled: !canRestore,
        restoreStyle: 'font-size: 24px; ' + (canRestore ? 'color: #f2ede2;' : 'color: #77716a;'),
        restoreHint: canRestore ? 'Costs 100 silver. A new lord, 5 families and building goods.' : 'Needs 100 silver.',
        restoreHintColor: canRestore ? '#a9a190' : '#b0705c',
        onRestore: () => this.restore(i)
      };
    });
    const tribute = Object.keys(totals).map((g) => totals[g] + ' ' + g).join(', ') || 'none';
    return { slots: slots, tribute: tribute, count: count, silver: s.silver, reset: () => this.setState(this.initial()) };
  }
}
</script>
</body>
</html>
