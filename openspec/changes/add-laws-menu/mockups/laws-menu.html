<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laws menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+SC:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0a}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid #e8c87a;outline-offset:3px}
.opt:hover:not(:disabled){color:#f2ede2 !important}
.act:hover:not(:disabled) .word{color:#e8c87a}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #1c1b18 0%, #0e0e0d 70%, #090908 100%); color: #f2ede2; font-family: Alegreya, serif; display: flex; flex-direction: column; align-items: center;">

  <div style="padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <h1 style="margin: 0; font-family: 'Alegreya SC', serif; font-weight: 500; font-size: 26px; letter-spacing: 5px;">Laws</h1>
    <div style="width: 220px; height: 1px; background: linear-gradient(90deg, transparent, #9c8455 20%, #9c8455 80%, transparent);"></div>
  </div>

  <div style="margin-top: 10px; display: flex; gap: 56px; font-size: 19px; color: #c9c1b0; align-items: baseline;">
    <span>Laws in force: <span style="color: {{slotColor}};">{{active}} / {{slots}}</span></span>
    <span>Law slots: <span style="color: #e8c87a;">2</span> base <span style="color: #e8c87a;">{{extraSlots}}</span></span>
    <span>Unlocked: <span style="color: #e8c87a;">{{unlocked}} of {{total}}</span></span>
  </div>

  <div style="margin-top: 8px; display: flex; gap: 28px;">
    <sc-for list="{{filters}}" as="f">
      <button type="button" class="opt" onClick="{{f.onClick}}" aria-pressed="{{f.selected}}" style="{{f.style}}">{{f.text}}</button>
    </sc-for>
  </div>

  <div style="margin-top: 10px; width: 1360px; flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px 20px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 12px; background: linear-gradient(180deg, rgba(58,55,49,0.92), rgba(40,38,34,0.92)); box-shadow: inset 0 0 60px rgba(0,0,0,0.55); clip-path: polygon(0 1%, 3% 0, 40% 0.6%, 70% 0, 97% 0.8%, 100% 0, 99.6% 50%, 100% 99%, 60% 100%, 30% 99.3%, 1% 100%, 0 97%);">
    <sc-for list="{{laws}}" as="l" hint-placeholder-count="9">
      <div style="{{l.style}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
          <span style="font-size: 21px;">{{l.name}}</span>
          <span style="font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: {{l.statusColor}};">{{l.status}}</span>
        </div>
        <span style="font-size: 14px; color: #8f8878;">{{l.source}}</span>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <sc-for list="{{l.effects}}" as="e">
            <span style="font-size: 15px; color: {{e.color}};"><span style="color: #8f8878; font-size: 12px;">&#9671;</span> {{e.text}}</span>
          </sc-for>
        </div>
        <span style="flex-grow: 1;"></span>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
          <span style="font-size: 13px; color: {{l.hintColor}}; line-height: 1.25;">{{l.hint}}</span>
          <button type="button" class="act" onClick="{{l.onClick}}" disabled="{{l.disabled}}" aria-label="{{l.aria}}" style="{{l.btnStyle}}"><span class="word">{{l.btn}}</span></button>
        </div>
      </div>
    </sc-for>
  </div>

  <button type="button" class="act" style="height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; font-size: 30px;">
    <span style="font-size: 20px; color: #c9c1b0;">&#10087;</span><span class="word">Close</span><span style="font-size: 20px; color: #c9c1b0; display: inline-block; transform: scaleX(-1);">&#10087;</span>
  </button>
  <span style="position: absolute; right: 120px; bottom: 6px; font-size: 13px; color: #6f6a60;">EARLY ACCESS (Version 0.8.117) MODDED</span>
  <button type="button" onClick="{{reset}}" style="position: absolute; left: 20px; bottom: 14px; font-size: 13px; color: #6f6a60; border: 1px solid #3a3731; padding: 4px 10px;">Demo: reset</button>
  <button type="button" onClick="{{toggleSlot}}" style="position: absolute; left: 130px; bottom: 14px; font-size: 13px; color: #6f6a60; border: 1px solid #3a3731; padding: 4px 10px;">Demo: {{slotDemo}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial();
  }
  // Laws and effects copied from mod/InvasionMod/data/tech_tree/tree.json. "Unlocked by" mixes tech tree and contract unlocks for the demo.
  initial() {
    return {
      filter: 'all',
      extraSlot: false,
      laws: [
        { id: 'strip', name: 'Strip the Dead', source: 'Tech tree: Corpse Robbing', unlocked: true, active: true,
          effects: [['Bandit bodies at the corpse pit pay loot', 1], ['-1 Public Order for each looted body', -1]] },
        { id: 'curfew', name: 'Curfew', source: 'Reward of a Large contract', unlocked: true, active: false,
          effects: [['Banditry costs half as much Public Order', 1], ['-4 Approval', -1]] },
        { id: 'disarm', name: 'Disarm the Peasantry', source: 'Tech tree: Armory Census', unlocked: true, active: false,
          effects: [['Each day the weapons of the homes go to the storehouse', 0], ['-3 Approval', -1]] },
        { id: 'trade', name: 'Trade Pacts', source: 'Tech tree: Prosperity, Amnesty', unlocked: true, active: false,
          effects: [['Vassal tribute +25%', 1]] },
        { id: 'conscription', name: 'Conscription', source: 'Tech tree: Oppression, Martial Law', unlocked: false, active: false,
          effects: [['Militia attack +10%', 1], ['-5 Approval', -1]] },
        { id: 'walls', name: 'Forced Labor on Walls', source: 'Tech tree: Oppression, Iron Hand', unlocked: false, active: false,
          effects: [['+5 Public Order', 1], ['-3 Approval', -1]] },
        { id: 'scorched', name: 'Scorched Earth', source: 'Tech tree: Oppression, Veteran Levies', unlocked: false, active: false,
          effects: [['Militia defence +10%', 1], ['Vassal tribute -25%', -1]] },
        { id: 'charter', name: 'Militia Charter', source: 'Tech tree: Prosperity, Fair Courts', unlocked: false, active: false,
          effects: [['Militia attack +5%', 1], ['+2 Approval', 1]] },
        { id: 'payoff', name: 'Pay Off Warbands', source: 'Tech tree: Prosperity, Militia Rights', unlocked: false, active: false,
          effects: [['Bandit buy-back price -25%', 1]] }
      ]
    };
  }
  toggle(id) {
    const laws = this.state.laws.map((l) => (l.id === id ? Object.assign({}, l, { active: !l.active }) : l));
    this.setState({ laws: laws });
  }
  renderVals() {
    const s = this.state;
    const slots = 2 + (s.extraSlot ? 1 : 0);
    const active = s.laws.filter((l) => l.active).length;
    const full = active >= slots;
    const base = 'box-sizing: border-box; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; ';
    const shown = s.laws.filter((l) => s.filter === 'all' || (s.filter === 'unlocked' ? l.unlocked : !l.unlocked));
    const laws = shown.map((l) => {
      let status, statusColor, style, btn, disabled, hint, hintColor, btnColor;
      if (l.active) {
        status = 'In force'; statusColor = '#9fb37a';
        style = base + 'background: rgba(60,50,30,0.55); border-top: 1px solid #e8c87a;';
        btn = 'Revoke'; disabled = false; hint = 'Revoke frees a law slot.'; hintColor = '#a9a190'; btnColor = '#f2ede2';
      } else if (l.unlocked) {
        status = 'Unlocked'; statusColor = '#e8c87a';
        style = base + 'background: rgba(20,19,17,0.55); border-top: 1px solid #4a463e;';
        btn = 'Enact'; disabled = full;
        hint = full ? 'All law slots are used. Revoke a law first.' : 'Takes effect at once.';
        hintColor = full ? '#b0705c' : '#a9a190'; btnColor = full ? '#77716a' : '#f2ede2';
      } else {
        status = 'Locked'; statusColor = '#8f8878';
        style = base + 'background: rgba(20,19,17,0.3); border-top: 1px solid #33302b; opacity: 0.62;';
        btn = 'Locked'; disabled = true; hint = 'Unlock in the tech tree or win it from a Large contract.'; hintColor = '#8f8878'; btnColor = '#77716a';
      }
      return {
        name: l.name, source: 'Unlocked by: ' + l.source, status: status, statusColor: statusColor, style: style,
        effects: l.effects.map((e) => ({ text: e[0], color: e[1] > 0 ? '#9fb37a' : e[1] < 0 ? '#c98a78' : '#c9c1b0' })),
        hint: hint, hintColor: hintColor, btn: btn, disabled: disabled,
        btnStyle: 'flex-shrink: 0; font-size: 21px; padding: 2px 4px; border-bottom: 1px solid #4a463e; color: ' + btnColor + ';',
        aria: btn + ': ' + l.name,
        onClick: () => this.toggle(l.id)
      };
    });
    const filters = [['all', 'All'], ['unlocked', 'Unlocked'], ['locked', 'Locked']].map((f) => ({
      text: f[1], selected: s.filter === f[0] ? 'true' : 'false',
      style: 'font-size: 18px; padding: 1px 0; ' + (s.filter === f[0] ? 'color: #e8c87a; border-bottom: 1px solid #e8c87a;' : 'color: #8f8878; border-bottom: 1px solid transparent;'),
      onClick: () => this.setState({ filter: f[0] })
    }));
    return {
      laws: laws, filters: filters, active: active, slots: slots,
      slotColor: full ? '#d0a050' : '#e8c87a',
      extraSlots: s.extraSlot ? '+ 1 from a contract' : '',
      unlocked: s.laws.filter((l) => l.unlocked).length, total: s.laws.length,
      slotDemo: s.extraSlot ? 'remove contract slot' : 'win extra law slot',
      toggleSlot: () => this.setState({ extraSlot: !s.extraSlot }),
      reset: () => this.setState(this.initial())
    };
  }
}
</script>
</body>
</html>
