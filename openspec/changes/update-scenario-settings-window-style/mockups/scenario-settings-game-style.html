<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenario start screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+SC:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0a}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible{outline:2px solid #e8c87a;outline-offset:3px}
.opt:hover{color:#f2ede2 !important}
.act:hover .word{color:#e8c87a}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #1c1b18 0%, #0e0e0d 70%, #090908 100%); color: #f2ede2; font-family: Alegreya, serif; display: flex; flex-direction: column; align-items: center;">

  <div style="padding-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <h1 style="margin: 0; font-family: 'Alegreya SC', serif; font-weight: 500; font-size: 30px; letter-spacing: 6px;">The Hussites Are Coming</h1>
    <div style="width: 360px; height: 1px; background: linear-gradient(90deg, transparent, #9c8455 20%, #9c8455 80%, transparent);"></div>
  </div>

  <div style="margin-top: 22px; width: 1240px; flex-grow: 1; box-sizing: border-box; padding: 26px 48px; display: flex; gap: 48px; background: linear-gradient(180deg, rgba(58,55,49,0.92), rgba(40,38,34,0.92)); box-shadow: inset 0 0 60px rgba(0,0,0,0.55); clip-path: polygon(0 1%, 3% 0, 40% 0.6%, 70% 0, 97% 0.8%, 100% 0, 99.6% 50%, 100% 99%, 60% 100%, 30% 99.3%, 1% 100%, 0 97%);">

    <div style="width: 440px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px;">
      <div style="background: rgba(15,15,13,0.5); padding: 8px 0; text-align: center; font-size: 24px;">The Scenario</div>
      <p style="margin: 0; font-size: 19px; line-height: 1.6;">Placeholder text. The owner writes the background of the scenario here: who the <span style="color: #e8c87a; text-transform: uppercase; letter-spacing: 1px; font-size: 17px;">Hussites</span> are, and why they ride against your village.</p>
      <span style="flex-grow: 1;"></span>
      <div style="display: {{warnDisplay}}; gap: 10px; align-items: baseline; padding: 10px 14px; background: rgba(120,50,40,0.25); border-left: 2px solid #b0705c;">
        <span style="color: #b0705c;">&#9671;</span>
        <span style="font-size: 17px; color: #e6c9bd;">Vassals are not enabled. Vassal raids have no effect.</span>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
      <div style="background: rgba(15,15,13,0.5); padding: 8px 0; text-align: center; font-size: 24px; margin-bottom: 8px;">Settings</div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid #3a3731;">
          <span style="width: 230px; flex-shrink: 0; display: flex; gap: 10px; align-items: baseline; font-size: 21px;"><span style="color: #8f8878; font-size: 15px;">&#9671;</span>{{row.label}}</span>
          <div style="display: flex; gap: 26px;">
            <sc-for list="{{row.options}}" as="o">
              <button type="button" class="opt" onClick="{{o.onClick}}" aria-pressed="{{o.selected}}" style="{{o.style}}">{{o.text}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height: 76px; flex-shrink: 0; display: flex; align-items: center; gap: 90px;">
    <button type="button" class="act" onClick="{{defaults}}" style="font-size: 24px; color: #c9c1b0;"><span class="word">Use defaults</span></button>
    <button type="button" class="act" style="display: flex; align-items: center; gap: 18px; font-size: 32px;">
      <span style="font-size: 20px; color: #c9c1b0;">&#10087;</span><span class="word">Begin the game</span><span style="font-size: 20px; color: #c9c1b0; display: inline-block; transform: scaleX(-1);">&#10087;</span>
    </button>
  </div>
  <span style="position: absolute; right: 120px; bottom: 6px; font-size: 13px; color: #6f6a60;">EARLY ACCESS (Version 0.8.117) MODDED</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: this.defaults(), vassalsOn: false };
  }
  rowsDef() {
    return [
      { id: 'yearly', label: 'Yearly player raid', options: ['Off', 'Easy', 'Medium', 'Hard'], def: 2 },
      { id: 'great', label: 'Great raid', options: ['Off', 'Easy', 'Medium', 'Hard'], def: 2 },
      { id: 'vassal', label: 'Vassal raids', options: ['Off', 'Easy', 'Medium', 'Hard'], def: 2 },
      { id: 'first', label: 'First Hussite raid', options: ['After 1 year', 'After 2 years', 'After 3 years'], def: 1 },
      { id: 'size', label: 'Raid size', options: ['Small', 'Medium', 'Large'], def: 1 }
    ];
  }
  defaults() {
    const p = {};
    this.rowsDef().forEach((r) => { p[r.id] = r.def; });
    return p;
  }
  renderVals() {
    const s = this.state;
    const rows = this.rowsDef().map((r) => ({
      label: r.label,
      options: r.options.map((t, i) => {
        const sel = s.pick[r.id] === i;
        return {
          text: t, selected: sel ? 'true' : 'false',
          style: 'font-size: 19px; padding: 2px 0; ' + (sel ? 'color: #e8c87a; border-bottom: 1px solid #e8c87a;' : 'color: #8f8878; border-bottom: 1px solid transparent;'),
          onClick: () => { const p = Object.assign({}, s.pick); p[r.id] = i; this.setState({ pick: p }); }
        };
      })
    }));
    const warn = !s.vassalsOn && s.pick.vassal !== 0;
    return { rows: rows, warnDisplay: warn ? 'flex' : 'none', defaults: () => this.setState({ pick: this.defaults() }) };
  }
}
</script>
</body>
</html>
